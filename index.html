                </div>
                <div class="right-box">
                    <p style="font-size:12px; color:#94a3b8;">预估毛利率</p>
                    <p style="font-size:24px; font-weight:900;" class="green">${item.margin}</p>
                    <div class="btn-group">
                        <a href="${url1688}" target="_blank" class="btn-1688">🔍 1688 找工厂</a>
                        <div class="row-btns">
                            <button class="btn-sub" onclick="navigator.clipboard.writeText('${item.kw}'); alert('已复制搜索词: ${item.kw}');">📋 复制词</button>
                            <button class="btn-sub ${isFav ? 'btn-fav-active' : ''}" onclick="toggleFavorite(${item.id}, event)">${isFav ? '❤️ 已收藏' : '🤍 收藏'}</button>
                        </div>
                    </div>
                </div>
            </div>`;
        }).join('');
    }

    function setCategory(cat, btn) {
        currentCategory = cat;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        applyFilter();
    }

    function applyFilter() {
        const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
        let list = [...masterPool];

        if (currentCategory === 'fav') {
            list = list.filter(item => favorites.includes(item.id));
        } else if (currentCategory !== 'all') {
            list = list.filter(item => item.platform === currentCategory);
        }

        if (keyword) {
            list = list.filter(item => 
                item.title.toLowerCase().includes(keyword) || 
                item.desc.toLowerCase().includes(keyword) || 
                item.heat.toLowerCase().includes(keyword) ||
                item.kw.toLowerCase().includes(keyword)
            );
        }

        list.sort((a, b) => b.score - a.score);
        render(list);
    }

    async function fetchAllData() {
        const status = document.getElementById('statusBar');
        const timeEl = document.getElementById('refreshTime');
        const apiKey = document.getElementById('dsKey').value.trim();

        // 核心汰弱留强机制：淘汰当前主池中最低分的旧爆品，从替补池轮换
        masterPool.sort((a, b) => a.score - b.score);
        const lowestItem = masterPool[0];
        let incomingItem = null;

        if (candidatePool.length > 0) {
            incomingItem = candidatePool.shift();
            candidatePool.push(lowestItem);
        } else {
            incomingItem = {
                id: Date.now(),
                platform: "TikTok",
                heat: "🔥 实时全网新捕获爆品 +580%",
                score: 97,
                title: "多功能纳米无痕双面胶带 (Nano Magic Clear Tape)",
                price: "$12.99",
                cost: "¥3.2",
                margin: "90%",
                kw: "纳米无痕双面胶 强力透明胶带",
                desc: "TikTok 房间改造与收纳类目霸榜神器，撕下不留痕，成本极低、复购率爆表。"
            };
            candidatePool.push(lowestItem);
        }

        const indexToReplace = masterPool.findIndex(item => item.id === lowestItem.id);
        if (indexToReplace !== -1) {
            masterPool[indexToReplace] = incomingItem;
        }
        applyFilter();

        if (apiKey) {
            status.innerHTML = `<span style="color:#38bdf8;">⏳ 正在向 DeepSeek API 真正发送联网请求...</span>`;
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 8000);

                const response = await fetch("https://api.deepseek.com/chat/completions", {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json", 
                        "Authorization": `Bearer ${apiKey}` 
                    },
                    body: JSON.stringify({
                        model: "deepseek-chat",
                        messages: [{ role: "user", content: "请推荐1个当前TikTok或亚马逊极具爆发力的跨境小商品。严格只返回JSON格式：{\"id\":999,\"platform\":\"TikTok\",\"heat\":\"🔥 DeepSeek AI 实时推演爆品\",\"score\":100,\"title\":\"中英文产品名\",\"price\":\"$24.99\",\"cost\":\"¥8.0\",\"margin\":\"87%\",\"kw\":\"1688搜索词\",\"desc\":\"50字痛点与爆款逻辑拆解\"}" }],
                        response_format: { type: "json_object" }
                    }),
                    signal: controller.signal
                });

                clearTimeout(timeoutId);

                if (!response.ok) {
                    throw new Error(`API 响应错误状态码: ${response.status}`);
                }

                const data = await response.json();
                const aiItem = JSON.parse(data.choices[0].message.content);
                aiItem.id = Date.now();

                masterPool.sort((a, b) => a.score - b.score);
                masterPool[0] = aiItem;
                applyFilter();

                status.innerHTML = `<span class="green">✅ DeepSeek API 请求成功！已联网生成并置顶最新 AI 爆品。</span>`;
            } catch (error) {
                console.error("DeepSeek API 请求失败:", error);
                status.innerHTML = `<span class="red">⚠️ API 请求未成功（原因: ${error.message || '网络受限或跨域'}），已自动完成本地汰弱留强轮换。</span>`;
            }
        } else {
            status.innerHTML = `<span class="green">♻️ 成功淘汰低分旧品「${lowestItem.title.substring(0,10)}...」，引入高热新品！(未填API Key)</span>`;
        }

        const now = new Date();
        const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
        timeEl.innerText = `刷新于: ${timeStr}`;
    }

    applyFilter();
</script>
</body>
</html>
