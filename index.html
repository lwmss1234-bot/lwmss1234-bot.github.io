    function runCalc() {
        const price = parseFloat(document.getElementById('cPrice').value) || 0;
        const costRmb = parseFloat(document.getElementById('cCost').value) || 0;
        const shipRmb = parseFloat(document.getElementById('cShip').value) || 0;

        const feePct = parseFloat(document.getElementById('cFee').value) || 0;
        const rate = parseFloat(document.getElementById('cRate').value) || 7.2;

        const totalHardCostUsd = (costRmb + shipRmb) / rate + (price * (feePct / 100));
        const grossProfitBeforeAdUsd = price - totalHardCostUsd;
        const breakevenRoas = grossProfitBeforeAdUsd > 0 ? (price / grossProfitBeforeAdUsd).toFixed(2) : '无法保本';
        const actualRoas = (price / cpaUsd).toFixed(2);
        const netProfitUsd = grossProfitBeforeAdUsd - cpaUsd;
        const netProfitRmb = (netProfitUsd * rate).toFixed(1);
        const monthlyProfitWan = ((netProfitUsd * rate * 100 * 30) / 10000).toFixed(1);

        document.getElementById('rBreakevenRoas').innerText = grossProfitBeforeAdUsd > 0 ? `1 : ${breakevenRoas}` : '亏本定价';

                            <option value="watch" ${st==='watch'?'selected':''}>👀 重点观望中</option>
                            <option value="sample" ${st==='sample'?'selected':''}>📦 已1688拿样</option>
                            <option value="ads" ${st==='ads'?'selected':''}>🚀 正在投流测款</option>
                        </select>
                    </div>
                    <h3>${item.title}</h3>
                    <div class="script-box">
                        <div><strong class="cyan">${item.hook}</strong></div>
                        <div style="color:#94a3b8; font-size:12px; margin-top:4px;">🎯 投流受众定向：${item.audience}</div>
                    </div>
                    <div class="metrics-row">
                        <span>📈 7日出单量: <b class="gold">${item.sales7d}</b></span>
                        <span>💵 海外售价: <b style="color:#fff">${item.price}</b></span>
                        <span>🏭 1688拿货价: <b class="green">${item.cost}</b></span>
                        <span>🔥 爆品权重分: <b class="cyan">${item.score}</b></span>
                    </div>
                </div>
                <div class="right-box">
                    <div>
                        <p style="font-size:12px; color:#94a3b8;">预估毛利空间</p>
                        <p style="font-size:26px; font-weight:900;" class="green">${item.margin}</p>
                    </div>
                    <div class="btn-group">
                        <button class="btn-calc" onclick="openCalc('${item.title.replace(/'/g, "")}', '${item.price}', '${item.cost}')">💰 算投流回本 ROAS / 净利</button>
                        <a href="${urlTikTokVideo}" target="_blank" class="btn-tt">▶️ 看 TikTok 爆款原视频</a>
                        <a href="${url1688}" target="_blank" class="btn-1688">🔍 1688 找源头工厂</a>
                        <div class="row-btns">
                            <button class="btn-sub" onclick="openScriptModal(${item.id})">🎬 15秒脚本</button>
                            <a href="${urlTikTokAds}" target="_blank" class="btn-sub">📊 广告库</a>
                            <button class="btn-sub ${isFav ? 'btn-fav-active' : ''}" onclick="toggleFavorite(${item.id}, event)">${isFav ? '❤️' : '🤍'}</button>
                        </div>
                    </div>
                </div>
            </div>`;
        }).join('');
    }

    function setCategory(cat, btn) {
        currentCategory = cat;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        applyFilter();
    }

    function applyFilter() {
        const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
        let list = [...masterPool];

        if (currentCategory === 'fav') {
            list = list.filter(item => favorites.includes(item.id));
        } else if (currentCategory === 'testing') {
            list = list.filter(item => itemStatuses[item.id] && itemStatuses[item.id] !== 'none');
        } else if (currentCategory !== 'all') {
            list = list.filter(item => item.category === currentCategory);
        }

        if (keyword) {
            list = list.filter(item => 
                item.title.toLowerCase().includes(keyword) || 
                item.hook.toLowerCase().includes(keyword) || 
                item.audience.toLowerCase().includes(keyword) ||
                item.heat.toLowerCase().includes(keyword) ||
                item.kw.toLowerCase().includes(keyword)
            );
        }

        list.sort((a, b) => b.score - a.score);
        render(list);
    }

    function quickHunt(niche) {
        document.getElementById('nicheInput').value = niche;
        huntCustomNiche();
    }

    function huntCustomNiche() {
        const niche = document.getElementById('nicheInput').value.trim();
        if (!niche) {
            alert('请先输入你想挖掘的细分赛道关键词（如：万圣节、美甲、钓鱼、宠物...）');
            return;
        }
        fetchAllData(niche);
    }

    async function fetchAllData(customNiche = '') {
        const status = document.getElementById('statusBar');
        const apiKey = document.getElementById('dsKey').value.trim();

        // 若未指定赛道，先执行本地汰弱留强
        if (!customNiche) {
            masterPool.sort((a, b) => a.score - b.score);
            const lowestItem = masterPool[0];
            let incomingItem = candidatePool.shift();
            candidatePool.push(lowestItem);

            const indexToReplace = masterPool.findIndex(item => item.id === lowestItem.id);
            if (indexToReplace !== -1) {
                masterPool[indexToReplace] = incomingItem;
            }
            applyFilter();
        }

        if (apiKey) {
            const targetPrompt = customNiche 
                ? `请针对【${customNiche}】这个细分赛道，推荐1个当前TikTok美区极具爆发力的新奇特暴利商品。`
                : `请推荐1个当前TikTok美区极具爆发力的新奇特暴利商品（避开常见普通品）。`;

            status.innerHTML = `<span class="cyan">⏳ 正在呼叫 DeepSeek 挖掘${customNiche ? '【'+customNiche+'】赛道' : '全网'}最新投流爆品并永久写入你的选品库...</span>`;
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 9000);

                const response = await fetch("https://api.deepseek.com/chat/completions", {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json", 
                        "Authorization": `Bearer ${apiKey}` 
                    },
                    body: JSON.stringify({
                        model: "deepseek-chat",
                        messages: [{ role: "user", content: `你现在是TikTok海外广告投流监控专家(Kalodata/PiPiADS)。${targetPrompt}严格只返回JSON格式：{"id":999,"category":"AdSpy","heat":"💰 AI定向挖掘 · 连续投流爆款","score":100,"sales7d":"8,920 单","roas":"1 : 4.8","title":"中文名 (English Name)","enKw":"English Search Keyword","price":"$27.99","cost":"¥9.5","margin":"86%","kw":"1688搜索词","hook":"🎬 黄金前3秒：具体画面镜头与痛点拆解","audience":"精准投流受众人群画像"}` }],
                        response_format: { type: "json_object" }
                    }),
                    signal: controller.signal
                });

                clearTimeout(timeoutId);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();
                const aiItem = JSON.parse(data.choices[0].message.content);
                aiItem.id = Date.now();

                // 永久保存到用户的本地扩展爆品库，越用越多！
                savedCustomItems.unshift(aiItem);
                localStorage.setItem('radar_custom_pool_v5', JSON.stringify(savedCustomItems));

                masterPool.unshift(aiItem);
                applyFilter();

                status.innerHTML = `<span class="green">✅ 挖掘成功！新爆品「${aiItem.title}」已置顶并永久存入你的选品库（当前共 ${masterPool.length} 款）！</span>`;
            } catch (error) {
                status.innerHTML = `<span class="red">⚠️ API 请求异常（${error.message}），请确认 DeepSeek Key 余额充足。已完成本地高分轮换！</span>`;
            }
        } else {
            status.innerHTML = `<span class="gold">💡 提示：在右上角粘贴 DeepSeek API Key 后，即可激活「AI 任意赛道无限裂变挖品」并永久扩充你的爆品库！</span>`;
        }
    }

    // 导出 CSV 报表
    function exportCSV() {
        const headers = ["商品名称,所属榜单,热度表现,7日销量,预估ROAS,海外售价,1688底价,毛利率,1688搜索词,黄金前3秒钩子\n"];
        const rows = masterPool.map(i => `"${i.title}","${i.category}","${i.heat}","${i.sales7d}","${i.roas}","${i.price}","${i.cost}","${i.margin}","${i.kw}","${i.hook}"`);
        const blob = new Blob(["\uFEFF" + headers.concat(rows).join("\n")], { type: "text/csv;charset=utf-8;" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `TikTok_AdSpy_爆品选品表_${new Date().toISOString().slice(0,10)}.csv`;
        link.click();
    }

    applyFilter();
</script>
</body>
</html>
